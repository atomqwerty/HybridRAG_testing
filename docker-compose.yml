

services:
  # RAG Application Class
  rag-app:
    build: .
    container_name: hybrid_rag_app
    ports:
      - "8080:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://aigateway.ntictsolution.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Qwen3-Embedding-4B}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY}
      - OPENAI_EMBEDDING_BASE_URL=${OPENAI_EMBEDDING_BASE_URL:-https://aigateway.ntictsolution.com/v1}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-2560}
      - OCR_API_KEY=${OCR_API_KEY}
    volumes:
      - .:/app
    depends_on:
      - neo4j
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Neo4j Database
  neo4j:
    image: neo4j:5.20.0
    container_name: hybrid_rag_neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    restart: always

volumes:
  neo4j_data:
  neo4j_plugins:
