version: "3.9"

services:
  neo4j:
    image: neo4j:2025.09.0-enterprise-bullseye
    container_name: neo4j-docker
    restart: unless-stopped

    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
      - "7688:7688"   # Bolt Routing (AUTO)

    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/test1234
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      # ADD THESE LINES:
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"

    volumes:
      - "C:/Users/Dashboard/Documents/Neo4j/data:/data"
      - "C:/Users/Dashboard/Documents/Neo4j/logs:/logs"
      - "C:/Users/Dashboard/Documents/Neo4j/import:/import"
      - "C:/Users/Dashboard/Documents/Neo4j/plugins:/plugins"
