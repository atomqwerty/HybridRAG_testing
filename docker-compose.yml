version: '3.8'

services:
  # RAG Application Class
  rag-app:
    build: .
    container_name: hybrid_rag_app
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - OpenAi_api_key=${OpenAi_api_key}
    depends_on:
      - neo4j
    restart: always

  # Neo4j Database
  neo4j:
    image: neo4j:5.11.0
    container_name: hybrid_rag_neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
    restart: always

volumes:
  neo4j_data:
  neo4j_plugins:
